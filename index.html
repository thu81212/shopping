<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoppy Emotions</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>
    <!-- Decorative Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="blob blob-5"></div>
    <div class="blob blob-6"></div>
    <div class="blob blob-7"></div>

    <header>
        <div class="container">
            <h1 class="logo">Shoppy Emotions</h1>
            <div class="camera-icon">
                <svg width="32" height="32" viewBox="0 0 90 90" fill="none">
                    <circle cx="45" cy="45" r="20" fill="currentColor"/>
                    <rect x="20" y="35" width="50" height="25" rx="5" fill="none" stroke="currentColor" stroke-width="3"/>
                </svg>
            </div>
        </div>
    </header>

    <main>
        <section class="hero-section">
            <div class="container">
                <h2 class="hero-title">track your moods</h2>
                <h3 class="hero-subtitle">feel your shopping emotions</h3>

                <div class="camera-container">
                    <div class="video-wrapper">
                        <video id="video" autoplay muted playsinline></video>
                        <canvas id="overlay"></canvas>
                    </div>

                    <div class="emotion-display">
                        <p class="current-emotion">Current: <span id="emotion-text">---</span></p>
                        <div class="confidence-bar">
                            <div id="confidence-fill" class="confidence-fill"></div>
                        </div>
                    </div>
                </div>

                <button id="start-tracking" class="cta-button">
                    <svg width="24" height="24" viewBox="0 0 90 90" fill="none">
                        <circle cx="45" cy="45" r="20" fill="currentColor"/>
                    </svg>
                    <span>Start Emotion Tracking</span>
                </button>

                <div class="mood-dashboard">
                    <h3>Today's Mood</h3>
                    <div id="mood-stats" class="mood-stats"></div>

                    <h3>Mood History (7 Days)</h3>
                    <div id="mood-history" class="mood-history"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/emotion-detector.js"></script>
    <script src="js/mood-tracker.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
